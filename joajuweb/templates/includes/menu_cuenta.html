<div class="dropdown account-dropdown">
    <button class="account-dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Abrir menú de cuenta">
        {% if user.foto %}<img src="{{ user.foto.url }}" alt="" class="account-avatar">
        {% else %}<span class="account-avatar account-avatar--placeholder" aria-hidden="true">{% if user.first_name %}{{ user.first_name|slice:":1"|upper }}{{ user.last_name|slice:":1"|upper }}{% else %}{{ user.username|slice:":1"|upper }}{% endif %}</span>{% endif %}
        <span class="account-dropdown-email">{{ user.email|default:user.username }}</span>
        <i class="bi bi-chevron-down account-dropdown-chevron" aria-hidden="true"></i>
    </button>
    <ul class="dropdown-menu dropdown-menu-end account-dropdown-menu">
        <li><span class="dropdown-item-text account-dropdown-label">{{ user.email|default:user.username }}</span></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="{% url 'perfil' %}"><i class="bi bi-person me-2" aria-hidden="true"></i>Mi perfil y cuenta</a></li>
        <li><a class="dropdown-item" href="{% url 'ayuda' %}"><i class="bi bi-question-circle me-2" aria-hidden="true"></i>Obtener ayuda</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><form method="post" action="{% url 'logout' %}" class="m-0">{% csrf_token %}<button type="submit" class="dropdown-item account-dropdown-logout"><i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Cerrar sesión</button></form></li>
    </ul>
</div>
