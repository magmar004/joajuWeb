<nav class="navbar app-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-4" href="{% url 'home' %}">
            <i class="bi bi-diagram-3-fill brand-mark"></i> Joaju
        </a>
        <div class="d-flex align-items-center gap-3">
            <a href="{% url 'perfil' %}" class="user-chip">
                {% if user.foto %}
                    <img src="{{ user.foto.url }}" alt="" class="user-avatar">
                {% else %}
                    <span class="user-avatar">
                        {% if user.first_name %}{{ user.first_name|slice:":1"|upper }}{{ user.last_name|slice:":1"|upper }}{% else %}{{ user.username|slice:":1"|upper }}{% endif %}
                    </span>
                {% endif %}
                <span class="d-none d-sm-inline">{{ user.get_full_name|default:user.username }}</span>
            </a>
            <form method="post" action="{% url 'logout' %}" class="m-0">
                {% csrf_token %}
                <button type="submit" class="btn btn-brand-ghost btn-sm">
                    Salir
                </button>
            </form>
        </div>
    </div>
</nav>
