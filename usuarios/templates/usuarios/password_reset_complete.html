{% extends 'usuarios/base.html' %}

{% block title %}Contraseña Actualizada | JoajuWeb{% endblock %}

{% block content %}
<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 text-center w-100" style="max-width: 450px; background: #ffffff;">
        <i class="bi bi-shield-check fs-1 text-success mb-3"></i>
        <h3 class="fw-bold text-dark">¡Contraseña cambiada!</h3>
        <p class="text-muted small mb-4">Tu contraseña ha sido actualizada con éxito. Ya puedes iniciar sesión con tu nueva clave.</p>
        <a href="{% url 'login' %}" class="btn btn-brand-primary w-100 py-2.5 rounded-3">Iniciar sesión</a>
    </div>
</div>
{% endblock %}
