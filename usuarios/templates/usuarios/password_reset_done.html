{% extends 'usuarios/base.html' %}

{% block title %}Correo Enviado | JoajuWeb{% endblock %}

{% block content %}
<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 text-center w-100" style="max-width: 480px; background: #ffffff;">
        <i class="bi bi-envelope-check-fill fs-1 text-success mb-3"></i>
        <h3 class="fw-bold text-dark">Instrucciones enviadas</h3>
        <p class="text-muted small mb-4">
            Si el correo ingresado se encuentra registrado, recibirás un mensaje con el enlace para restablecer tu contraseña.
        </p>
        <a href="{% url 'login' %}" class="btn btn-outline-secondary w-100 py-2 rounded-3">Volver al inicio de sesión</a>
    </div>
</div>
{% endblock %}
