{% extends 'base.html' %}

{% block title %}Correo Enviado | JoajuWeb{% endblock %}

{% block content %}
<main class="page recovery-page min-vh-100 d-flex align-items-center" id="contenido" tabindex="-1">
<div class="container d-flex justify-content-center">
    <div class="surface-card surface-card--auth w-100 text-center">
        <span class="action-icon mb-3">
            <i class="bi bi-envelope-check-fill fs-4"></i>
        </span>
        <h1 class="fw-bold text-dark">Instrucciones enviadas</h1>
        <p class="text-muted small mb-4">
            Si el correo ingresado se encuentra registrado, recibirás un mensaje con el enlace para restablecer tu contraseña.
        </p>
        <a href="{% url 'login' %}" class="btn btn-brand-secondary w-100">Volver al inicio de sesión</a>
    </div>
</div>
</main>
{% endblock %}
