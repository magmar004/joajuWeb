{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2B2360">
    <link rel="icon" type="image/svg+xml" href="{% static 'vendor/bootstrap-icons/diagram-3-fill.svg' %}">
    <title>{% block title %}Joaju - Plataforma de Gestión{% endblock %}</title>
    <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
    <link href="{% static 'vendor/plus-jakarta-sans/fonts.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <link rel="stylesheet" href="{% static 'css/layouts.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="joaju-ui">
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    {% block content %}{% endblock %}

    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/ciudad_por_departamento.js' %}?v=3" defer></script>
</body>
</html>
