{% extends 'base.html' %}

{% block title %}Recuperar Contraseña | JoajuWeb{% endblock %}

{% block content %}
<div class="page min-vh-100 d-flex align-items-center">
<div class="container d-flex justify-content-center">
    <div class="surface-card surface-card--auth w-100">
        <div class="text-center mb-4">
            <div class="d-flex align-items-center justify-content-center gap-2 mb-3">
                <i class="bi bi-diagram-3-fill fs-4 brand-mark"></i>
                <span class="fs-5 fw-bold">Joaju</span>
            </div>
            <h3 class="fw-bold text-dark mt-2">¿Olvidaste tu contraseña?</h3>
            <p class="text-muted small mb-0">Ingresa tu correo registrado y te enviaremos un enlace seguro para restablecerla.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label for="id_email" class="form-label">Correo Electrónico</label>
                <input type="email" name="email" class="form-control custom-input" id="id_email" required placeholder="ejemplo@correo.com">
            </div>
            <button type="submit" class="btn btn-brand-primary w-100 mb-3">
                Enviar enlace de recuperación
            </button>
            <div class="text-center">
                <a href="{% url 'login' %}" class="back-link mb-0">Volver al inicio de sesión</a>
            </div>
        </form>
    </div>
</div>
</div>
{% endblock %}
