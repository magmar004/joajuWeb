{% extends 'usuarios/base.html' %}

{% block title %}Recuperar Contraseña | JoajuWeb{% endblock %}

{% block content %}
<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 w-100" style="max-width: 450px; background: #ffffff;">
        <div class="text-center mb-4">
            <i class="bi bi-key-fill fs-1 text-primary"></i>
            <h3 class="fw-bold text-dark mt-2">¿Olvidaste tu contraseña?</h3>
            <p class="text-muted small">Ingresa tu correo registrado y te enviaremos un enlace seguro para restablecerla.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label for="id_email" class="form-label">Correo Electrónico</label>
                <input type="email" name="email" class="form-control custom-input" id="id_email" required placeholder="ejemplo@correo.com">
            </div>
            <button type="submit" class="btn btn-brand-primary w-100 py-2.5 rounded-3 mb-3">
                Enviar enlace de recuperación
            </button>
            <div class="text-center">
                <a href="{% url 'login' %}" class="text-decoration-none small text-muted">Volver al inicio de sesión</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
