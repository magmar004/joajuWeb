{% extends 'base.html' %}

{% block title %}Contraseña Actualizada | JoajuWeb{% endblock %}

{% block content %}
<div class="page min-vh-100 d-flex align-items-center">
<div class="container d-flex justify-content-center">
    <div class="surface-card surface-card--auth w-100 text-center">
        <span class="action-icon mb-3">
            <i class="bi bi-shield-check fs-4"></i>
        </span>
        <h3 class="fw-bold text-dark">¡Contraseña cambiada!</h3>
        <p class="text-muted small mb-4">Tu contraseña ha sido actualizada con éxito. Ya puedes iniciar sesión con tu nueva clave.</p>
        <a href="{% url 'login' %}" class="btn btn-brand-primary w-100">Iniciar sesión</a>
    </div>
</div>
</div>
{% endblock %}
